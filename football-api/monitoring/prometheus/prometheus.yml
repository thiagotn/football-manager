global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # API v1 (FastAPI) descomissionada na VPS em 2026-07-31 — app migrado
  # para a API v2 no homelab; o scrape job 'api' foi removido junto com
  # as regras de alerta correspondentes (ver alerting/rules.yml).

  # Métricas dos containers Docker (CPU, RAM, rede por container)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Métricas do host (CPU, RAM, disco, rede da máquina)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
