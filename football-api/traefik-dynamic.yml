# Config dinâmica do Traefik do VPS legado (76.13.161.72) — LEGADO.
# A produção roda no homelab (k3s) desde o cutover de 2026-07-22; lá quem roteia são os
# Ingresses em helm/apps/rachao/ do repo `homelab`, atrás do Cloudflare Tunnel.
# Os routers de monitoramento (grafana/uptime/prometheus/status) foram removidos em 2026-09-10:
# o `status` fazia 301 para uptime.rachao.app, que já não resolvia — a status page agora é
# servida pelo Uptime Kuma do homelab em https://status.rachao.app (ADR 0009 do repo homelab).
http:

  routers:
    api:
      rule: "Host(`api.rachao.app`)"
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: api

    frontend:
      rule: "Host(`rachao.app`)"
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
        domains:
          - main: rachao.app
            sans: [www.rachao.app]
      service: frontend

    www:
      rule: "Host(`www.rachao.app`)"
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [www-redirect]
      service: frontend

    mcp:
      rule: "Host(`mcp.rachao.app`)"
      entrypoints: [websecure]
      tls:
        certResolver: letsencrypt
      service: mcp

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8000"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"

    mcp:
      loadBalancer:
        servers:
          - url: "http://mcp:8080"
        responseForwarding:
          flushInterval: "100ms"

  middlewares:
    www-redirect:
      redirectRegex:
        regex: "^https://www\\.rachao\\.app(.*)"
        replacement: "https://rachao.app${1}"
        permanent: true
