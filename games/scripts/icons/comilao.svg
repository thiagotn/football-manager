<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e1a52"/><stop offset="1" stop-color="#140a24"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3df0"/><stop offset="1" stop-color="#2ae0ff"/></linearGradient>
  <radialGradient id="neon" cx=".5" cy=".85" r=".8"><stop offset="0" stop-color="#ff3df0" stop-opacity=".3"/><stop offset="1" stop-color="#ff3df0" stop-opacity="0"/></radialGradient>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="512" height="512" fill="url(#floor)"/>
<rect width="512" height="512" fill="url(#neon)"/>

